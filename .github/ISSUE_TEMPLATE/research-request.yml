name: Game Research Request
description: Request a new CUSA game guide or additional research on an existing title.
title: "[Research] CUSAxxxxx - Game Title"
labels: ["research-request"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to request research on a PS4 title by CUSA ID.

        **Note:** Do not attach or link to copyrighted game files, dumps, or unauthorized downloads.

  - type: input
    id: game_title
    attributes:
      label: Game title
      description: Official game title and edition (if relevant).
      placeholder: "e.g., Horizon Zero Dawn Complete Edition"
    validations:
      required: true

  - type: input
    id: cusa_id
    attributes:
      label: CUSA ID
      description: 5-digit Sony PS4 Title ID (CUSA followed by 5 digits).
      placeholder: "e.g., CUSA10237"
    validations:
      required: true

  - type: input
    id: region_edition
    attributes:
      label: Region / edition / update context (optional)
      description: Disc vs digital, region, target firmware, or specific update/DLC you want researched.
      placeholder: "e.g., US disc, FW 11.00, wondering whether to install v1.54 before dumping"
    validations:
      required: false

  - type: textarea
    id: question
    attributes:
      label: What would you like researched? (optional)
      description: Specific questions, known errors you encountered, or links to existing discussions.
      placeholder: "e.g., Is Dump All or separate base+patch safer for this title?"
    validations:
      required: false
